<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>КПЛ Аналитика — Матчи</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="page-matches">
    <header>
      <h1>⚽ КПЛ Аналитика</h1>
      <nav>
        <a href="/" class="nav-home">Главная</a>
        <a href="/table" class="nav-table">Таблица</a>
        <a href="/clubs" class="nav-clubs">Клубы</a>
        <a href="/matches" class="nav-matches">Матчи</a>
        <a href="/news" class="nav-news">Новости</a>
      </nav>
    </header>

    <main>
      <button onclick="history.back()" class="btn btn-back">← Назад</button>
      <h2>Матчи лиги</h2>
      <div class="matches-list">
        {{range .}}
        <a href="/match?id={{.ID}}" class="match-card">
          <span class="match-date">{{.Date}}</span>
          <div class="match-teams">
            <span class="match-team">{{.HomeTeam}}</span>
            {{if .Played}}
            <span class="match-score">{{.HomeScore}} : {{.AwayScore}}</span>
            {{else}}
            <span class="match-vs">—</span>
            {{end}}
            <span class="match-team">{{.AwayTeam}}</span>
          </div>
          {{if .Played}}
          <span class="match-status played">Завершён</span>
          {{else}}
          <span class="match-status upcoming">Билеты от {{.Price}} ₸</span>
          {{end}}
        </a>
        {{end}}
      </div>
    </main>

    <footer>
      <p>КПЛ Аналитика · 2026</p>
    </footer>
  </body>
</html>
