<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>КПЛ Аналитика — Клубы</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="page-clubs">
    <header>
      <h1>⚽ КПЛ Аналитика</h1>
      <nav>
        <a href="/" class="nav-home">Главная</a>
        <a href="/table" class="nav-table">Таблица</a>
        <a href="/clubs" class="nav-clubs">Клубы</a>
        <a href="/news" class="nav-news">Новости</a>
      </nav>
    </header>

    <main>
      <button onclick="history.back()" class="btn btn-back">← Назад</button>
      <h2>Клубы лиги</h2>
      <div class="clubs-grid">
        {{range .}}
        <a href="/club?id={{.ID}}" class="club-card">
          <h3>{{.Name}}</h3>
          <p>{{.City}}</p>
          <span class="club-points">{{.Points}} очков</span>
        </a>
        {{end}}
      </div>
    </main>

    <footer>
      <p>КПЛ Аналитика · 2026</p>
    </footer>
  </body>
</html>
