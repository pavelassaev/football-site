<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>КПЛ Аналитика — Новости</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="page-news">
    <header>
      <h1>⚽ КПЛ Аналитика</h1>
      <nav>
        <a href="/" class="nav-home">Главная</a>
        <a href="/table" class="nav-table">Таблица</a>
        <a href="/clubs" class="nav-clubs">Клубы</a>
        <a href="/news" class="nav-news">Новости</a>
      </nav>
    </header>

    <main>
      <button onclick="history.back()" class="btn btn-back">← Назад</button>
      <h2>Новости лиги</h2>
      <div class="news-list">
        {{range .}}
        <a href="/article?id={{.ID}}" class="news-card">
          <span class="news-date">{{.Date}}</span>
          <h3>{{.Title}}</h3>
        </a>
        {{end}}
      </div>
    </main>

    <footer>
      <p>КПЛ Аналитика · 2026</p>
    </footer>
  </body>
</html>
