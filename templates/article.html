<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>КПЛ Аналитика — {{.Title}}</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="page-news">
    <header>
      <h1>⚽ КПЛ Аналитика</h1>
      <nav>
        <a href="/" class="nav-home">Главная</a>
        <a href="/table" class="nav-table">Таблица</a>
        <a href="/clubs" class="nav-clubs">Клубы</a>
        <a href="/news" class="nav-news">Новости</a>
      </nav>
    </header>

    <main>
      <button onclick="history.back()" class="btn btn-back">← Назад</button>
      <span class="news-date">{{.Date}}</span>
      <h2>{{.Title}}</h2>
      <div class="article-content">
        <p>{{.Content}}</p>
      </div>
    </main>

    <footer>
      <p>КПЛ Аналитика · 2026</p>
    </footer>
  </body>
</html>
