<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>КПЛ Аналитика — {{.Title}}</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1>КПЛ Аналитика</h1>
      <nav>
        <a href="/">Главная</a>
        <a href="/table">Таблица</a>
        <a href="/clubs">Клубы</a>
        <a href="/news">Новости</a>
      </nav>
    </header>

    <main>
      <a href="/news" class="back-link">← Назад к новостям</a>
      <span class="news-date">{{.Date}}</span>
      <h2>{{.Title}}</h2>
      <div class="article-content">
        <p>{{.Content}}</p>
      </div>
    </main>

    <footer>
      <p>Проект для колледжа · 2026</p>
    </footer>
  </body>
</html>
